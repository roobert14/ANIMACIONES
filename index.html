
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animación Agujero Negro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background: radial-gradient(circle, #15102b, #03030a 75%);
  overflow: hidden;
}

.escena {
  width: min(500px, 95vw);
  height: auto;
  overflow: visible;
}

.camino-espiral {
  fill: none;
  stroke: #a855f7;
  stroke-width: 1.5;
  opacity: 0.35;
  stroke-dasharray: 5 5;
}

.disco-acrecion {
  fill: url(#gradiente-disco);
  filter: blur(3px);
}

.horizonte-eventos {
  fill: black;
  stroke: #a855f7;
  stroke-width: 3;
  filter: drop-shadow(0 0 12px #a855f7);
}

.persona-animada {
  fill: #00f0ff;
  filter: drop-shadow(0 0 6px #00f0ff);
  offset-path: path("M 450 250 C 450 380, 360 430, 250 430 C 120 430, 70 340, 70 250 C 70 140, 150 90, 250 90 C 330 90, 390 150, 390 250 C 390 320, 330 370, 250 370 C 180 370, 130 300, 130 250 C 130 190, 190 150, 250 150 C 290 150, 330 190, 330 250 C 330 280, 280 310, 250 310 C 210 310, 190 270, 250 250");

  animation: absorber 6s infinite ease-in;
}

@keyframes absorber {
  0% {
    offset-distance: 0%;
    transform: scale(1.2);
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    offset-distance: 100%;
    transform: scale(0);
    opacity: 0;
  }
}

</style>
</head>

<body>

<svg viewBox="0 0 500 500" class="escena">

<defs>
  <radialGradient id="gradiente-disco">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="35%" stop-color="#7e22ce"/>
    <stop offset="65%" stop-color="#3b82f6"/>
    <stop offset="85%" stop-color="#f0abfc"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Trayectoria -->
<path class="camino-espiral"
d="M 450 250 C 450 380, 360 430, 250 430
C 120 430, 70 340, 70 250
C 70 140, 150 90, 250 90
C 330 90, 390 150, 390 250
C 390 320, 330 370, 250 370
C 180 370, 130 300, 130 250
C 130 190, 190 150, 250 150
C 290 150, 330 190, 330 250
C 330 280, 280 310, 250 310
C 210 310, 190 270, 250 250"/>

<!-- Disco de acreción -->
<circle cx="250" cy="250" r="100"
class="disco-acrecion"/>

<!-- Horizonte de eventos -->
<circle cx="250" cy="250" r="35"
class="horizonte-eventos"/>

<!-- Persona cayendo -->
<g class="persona-animada">
  <path transform="translate(-12,-12)"
  d="M12 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm-4.5 7c-1.1 0-2 .9-2 2v5h2v6h2.5v-6h0v-6h-2.5zm9 0h-2.5v6h0v6H16.5v-6h2v-5c0-1.1-.9-2-2-2z"/>
</g>

</svg>

</body>
</html>
